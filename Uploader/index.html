<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lua Uploader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Inter,
        Arial,
        sans-serif;

      color: #f5f7fa;

      background:
        radial-gradient(
          circle at top,
          #1c2433 0%,
          #0b0f16 45%,
          #07090d 100%
        );
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    .header {
      margin-bottom: 22px;
    }

    .badge {
      display: inline-block;

      padding: 6px 11px;

      border: 1px solid #303948;
      border-radius: 999px;

      color: #9da9bb;

      font-size: 12px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;

      font-size: 34px;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 8px;

      color: #8d98a8;

      font-size: 14px;
    }

    .panel {
      padding: 20px;

      border: 1px solid #27303d;
      border-radius: 18px;

      background: rgba(15, 20, 29, 0.88);

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);

      backdrop-filter: blur(12px);
    }

    .label {
      display: flex;
      justify-content: space-between;

      margin-bottom: 10px;

      color: #cbd3df;

      font-size: 13px;
      font-weight: 600;
    }

    textarea,
    input {
      width: 100%;

      border: 1px solid #303948;
      border-radius: 13px;

      outline: none;

      background: #090d13;
      color: #dce4ef;

      font-family:
        "JetBrains Mono",
        Consolas,
        monospace;

      font-size: 13px;
    }

    textarea {
      min-height: 390px;

      padding: 16px;

      resize: vertical;

      line-height: 1.6;
    }

    input {
      padding: 13px;
    }

    textarea:focus,
    input:focus {
      border-color: #65748a;
    }

    .actions {
      display: flex;
      gap: 10px;

      margin-top: 14px;
    }

    button {
      padding: 12px 18px;

      border: 0;
      border-radius: 11px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
      transform: none;
    }

    .convert {
      flex: 1;

      background: #f1f4f8;
      color: #080b10;
    }

    .clear {
      background: #1a202b;
      color: #bfc8d5;

      border: 1px solid #303948;
    }

    .result {
      display: none;

      margin-top: 18px;
    }

    .result input {
      min-height: 45px;
    }

    .copy {
      width: 100%;

      margin-top: 10px;

      background: #1a202b;
      color: #e4eaf2;

      border: 1px solid #303948;
    }

    .status {
      min-height: 20px;

      margin-top: 12px;

      color: #8995a6;

      font-size: 12px;
    }

    .filename {
      margin-top: 12px;

      color: #737f90;

      font-size: 12px;

      word-break: break-all;
    }

    @media (max-width: 650px) {
      body {
        padding: 14px;
      }

      h1 {
        font-size: 27px;
      }

      .panel {
        padding: 14px;
      }

      .actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">

      <span class="badge">
        LUA / LUAU TOOL
      </span>

      <h1>
        Auto Uploader
      </h1>

      <p class="subtitle">
        Upload source ke repository dan dapatkan Raw URL.
      </p>

    </header>


    <section class="panel">

      <div class="label">

        <span>
          Lua / Luau Source
        </span>

        <span id="counter">
          0 chars
        </span>

      </div>


      <textarea
        id="source"
        placeholder="Paste kode Lua / Luau di sini..."
        spellcheck="false"
      ></textarea>


      <div class="actions">

        <button
          class="convert"
          id="convertBtn"
        >
          Upload
        </button>

        <button
          class="clear"
          id="clearBtn"
        >
          Clear
        </button>

      </div>


      <div
        class="result"
        id="resultBox"
      >

        <div class="label">

          <span>
            Raw URL
          </span>

        </div>


        <input
          id="rawUrl"
          type="text"
          readonly
        />


        <button
          class="copy"
          id="copyBtn"
        >
          Copy Raw URL
        </button>


        <div
          class="filename"
          id="filename"
        ></div>

      </div>


      <div
        class="status"
        id="status"
      ></div>

    </section>

  </main>


  <script>

    const source =
      document.getElementById("source");

    const rawUrl =
      document.getElementById("rawUrl");

    const filename =
      document.getElementById("filename");

    const resultBox =
      document.getElementById("resultBox");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const convertBtn =
      document.getElementById("convertBtn");

    const clearBtn =
      document.getElementById("clearBtn");

    const copyBtn =
      document.getElementById("copyBtn");


    /*
     * Character counter
     */

    source.addEventListener(
      "input",
      () => {

        counter.textContent =
          `${source.value.length} chars`;

      }
    );


    /*
     * Upload
     */

    convertBtn.addEventListener(
      "click",
      async () => {

        const code =
          source.value.trim();


        if (!code) {

          status.textContent =
            "Source masih kosong.";

          resultBox.style.display =
            "none";

          return;

        }


        convertBtn.disabled =
          true;

        convertBtn.textContent =
          "Uploading...";


        status.textContent =
          "Membuat nama file dan mengupload...";


        resultBox.style.display =
          "none";


        try {

          const response =
            await fetch(
              "/api/convert",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  source: code
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok || !data.ok) {

            throw new Error(
              data.error ||
              "Upload gagal."
            );

          }


          rawUrl.value =
            data.rawUrl || "";


          filename.textContent =
            data.filename
              ? `File: ${data.filename}`
              : "";


          resultBox.style.display =
            "block";


          status.textContent =
            "Upload berhasil.";

        } catch (error) {

          status.textContent =
            error.message ||
            "Terjadi kesalahan.";

        } finally {

          convertBtn.disabled =
            false;

          convertBtn.textContent =
            "Upload";

        }

      }
    );


    /*
     * Copy Raw URL
     */

    copyBtn.addEventListener(
      "click",
      async () => {

        if (!rawUrl.value) {
          return;
        }


        try {

          await navigator.clipboard.writeText(
            rawUrl.value
          );

          status.textContent =
            "Raw URL berhasil disalin.";

        } catch {

          rawUrl.select();

          document.execCommand(
            "copy"
          );

          status.textContent =
            "Raw URL berhasil disalin.";

        }

      }
    );


    /*
     * Clear
     */

    clearBtn.addEventListener(
      "click",
      () => {

        source.value = "";
        rawUrl.value = "";
        filename.textContent = "";

        counter.textContent =
          "0 chars";

        resultBox.style.display =
          "none";

        status.textContent =
          "";

      }
    );

  </script>

</body>
</html>
